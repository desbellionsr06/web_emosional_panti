<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6D28D9" />
  <title>RuangTerhubung — Check-in Perasaan Lansia</title>

  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Library Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Atkinson Hyperlegible"', 'sans-serif'] },
          colors: { brand: { 50: '#f5f3ff', 100: '#ede9fe', 700: '#6D28D9', 800: '#5b21b6' } }
        }
      }
    };
  </script>
  <style>
    html {
      font-size: 19px;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #ede9fe;
    }

    .btn:active {
      transform: scale(.97);
      transition: transform .12s;
    }

    .rise {
      animation: rise .35s ease both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body class="font-sans text-slate-900 antialiased overflow-x-hidden">

  <!-- Container utama dibuat w-full agar mengisi layar laptop, dengan penyesuaian padding untuk desktop -->
  <div id="app" class="w-full min-h-screen bg-slate-50 relative pb-28 md:pb-12 md:pt-16">
    <main id="view" class="h-full"></main>
  </div>

  <!-- Navigasi: Di HP di bawah (bottom-0), di Laptop di atas (md:top-0) -->
  <nav id="bottom-nav"
    class="fixed bottom-0 md:top-0 md:bottom-auto left-0 w-full z-40 bg-white border-t-2 md:border-t-0 md:border-b-2 border-slate-200 shadow-sm transition-all">
  </nav>

  <div id="toast-root"></div>

  <script>
    // ==========================================
    // 1. KONEKSI KE SUPABASE
    // ==========================================
    const supabaseUrl = 'https://qbqqexduxvoykzhxflps.supabase.co';
    const supabaseKey = 'sb_publishable_uGEAHL2TBO70d6L-pCo-0A_hNjH8my9';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // ==========================================
    // 2. STATE & DATA
    // ==========================================
    let DB = { residents: [] };
    const S = { view: 'landing', step: 1, rid: null, mood: null, needs: [] };

    const MOODS = {
      1: { emoji: '😢', label: 'Sedih', color: '#b91c1c', soft: '#fee2e2' },
      2: { emoji: '🙂', label: 'Biasa saja', color: '#a16207', soft: '#fef3c7' },
      3: { emoji: '😊', label: 'Senang', color: '#047857', soft: '#d1fae5' }
    };

    const NEEDS = [
      { id: 'ngobrol', emoji: '💬', label: 'Ditemani ngobrol' },
      { id: 'keluarga', emoji: '📞', label: 'Menghubungi keluarga' },
      { id: 'ibadah', emoji: '🙏', label: 'Beribadah' },
      { id: 'jalan', emoji: '🌿', label: 'Jalan-jalan' },
      { id: 'kegiatan', emoji: '🎨', label: 'Ikut kegiatan' },
      { id: 'sepi', emoji: '😞', label: 'Merasa kesepian' }
    ];

    const $ = s => document.querySelector(s);
    const icon = (name, cls = 'w-7 h-7') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const avatar = (name) => `<div class="w-14 h-14 shrink-0 rounded-full bg-brand-700 text-white text-2xl font-bold flex items-center justify-center">${name ? name[0].toUpperCase() : '?'}</div>`;

    function toast(msg) {
      const el = document.createElement('div');
      el.className = `fixed top-20 md:top-6 left-1/2 -translate-x-1/2 z-[100] rise bg-slate-900 text-white font-bold px-6 py-4 rounded-2xl shadow-2xl text-center min-w-[280px]`;
      el.textContent = msg;
      $('#toast-root').appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // ==========================================
    // 3. FUNGSI DATABASE
    // ==========================================
    async function loadData() {
      const { data, error } = await supabaseClient.from('residents').select('*').order('id', { ascending: true });
      if (data) {
        DB.residents = data;
        if (S.view !== 'landing') render();
      }
    }

    async function finishCheckin() {
      const now = new Date();
      const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      const moodName = S.mood === 1 ? 'sad' : S.mood === 2 ? 'neutral' : 'happy';

      const r = DB.residents.find(x => x.id == S.rid);
      let updatedHistory = Array.isArray(r.history) && r.history.length === 7
        ? [...r.history]
        : ['happy', 'happy', 'neutral', 'sad', 'neutral', 'happy', null];

      updatedHistory[6] = moodName;

      await supabaseClient.from('residents').update({
        filled: true,
        time: timeStr,
        mood: moodName,
        needs: S.needs,
        history: updatedHistory
      }).eq('id', S.rid);

      S.step = 3;
      render();
      loadData();
    }

    async function addResident() {
      const name = $('#a-name').value.trim();
      const room = $('#a-room').value.trim();
      if (!name) return toast('Mohon isi nama dulu');

      const defaultHistory = ['happy', 'neutral', 'happy', 'happy', 'neutral', 'happy', null];

      await supabaseClient.from('residents').insert([{
        name,
        room,
        filled: false,
        needs: [],
        history: defaultHistory
      }]);
      toast(`${name} ditambahkan!`);

      $('#a-name').value = '';
      $('#a-room').value = '';
      loadData();
    }

    // ==========================================
    // 4. TAMPILAN HALAMAN (UI)
    // ==========================================

    function viewLanding() {
      // Menggunakan inset-0 agar ungu memenuhi seluruh layar terlepas dari container
      return `
  <div class="fixed inset-0 bg-brand-700 flex flex-col items-center justify-center text-white px-6 text-center z-50">
    <div class="w-24 h-24 bg-white/10 rounded-full flex items-center justify-center mb-6 rise">${icon('heart-handshake', 'w-12 h-12 text-white')}</div>
    <h1 class="text-4xl md:text-6xl font-bold mb-3 rise">RuangTerhubung</h1>
    <p class="text-xl md:text-2xl text-brand-100 mb-10 max-w-lg mx-auto rise">Sistem pantauan emosional harian lansia.</p>
    <button data-a="nav" data-v="home" class="btn w-full max-w-md min-h-[68px] rounded-2xl text-xl font-bold bg-white text-brand-800 shadow-xl rise hover:scale-105 transition-transform">Masuk ke Aplikasi</button>
  </div>`;
    }

    function viewHome() {
      const done = DB.residents.filter(r => r.filled).length;
      return `
  <header class="bg-brand-700 text-white px-5 pt-8 pb-7 md:pt-12 md:pb-10 shadow-md">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl md:text-4xl font-bold">Selamat datang! 👋</h1>
    </div>
  </header>
  <div class="px-4 mt-6 md:mt-8 space-y-6 max-w-5xl mx-auto">
    <div class="bg-white rounded-2xl border-2 border-slate-200 p-4 flex items-center gap-4 shadow-sm">
      <span class="text-4xl">📋</span>
      <p class="text-xl"><b>${done} dari ${DB.residents.length}</b> orang sudah mengisi hari ini</p>
    </div>
    <section>
      <h2 class="text-2xl font-bold mb-4">Siapa Anda?</h2>
      <!-- Grid akan menjadi 2 kolom di tablet (md) dan 3 kolom di laptop (lg) -->
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        ${DB.residents.map(r => `
        <button data-a="start" data-id="${r.id}" class="btn w-full text-left bg-white rounded-2xl border-2 ${r.filled ? 'border-emerald-400 shadow-emerald-100' : 'border-slate-300'} p-4 flex items-center gap-4 hover:shadow-md transition-shadow">
          ${avatar(r.name)}
          <span class="flex-1 min-w-0">
            <span class="block text-xl font-bold truncate">${r.name}</span>
            <span class="block text-base ${r.filled ? 'text-emerald-700 font-medium' : 'text-slate-500'}">${r.filled ? 'Sudah mengisi (' + (r.time || '') + ')' : 'Belum mengisi'}</span>
          </span>
          ${icon('chevron-right', 'w-7 h-7 text-slate-400')}
        </button>`).join('')}
      </div>
    </section>
  </div>`;
    }

    function viewCheckin() {
      const r = DB.residents.find(x => x.id == S.rid);
      if (!r) return viewHome();

      if (S.step === 1) return `
    <div class="max-w-5xl mx-auto px-4 pt-5 md:pt-8"><button data-a="nav" data-v="home" class="btn bg-white border-2 border-slate-300 px-5 py-2.5 rounded-xl font-bold hover:bg-slate-50 flex items-center gap-2 w-max">${icon('arrow-left', 'w-5 h-5')} Kembali</button></div>
    <div class="max-w-5xl mx-auto px-4 mt-6 md:mt-8 rise">
      <h1 class="text-3xl md:text-5xl font-bold leading-tight">Halo, ${r.name.split(' ')[0]}.<br/><span class="text-brand-700">Bagaimana perasaan Anda hari ini?</span></h1>
      <!-- Grid menyamping di laptop -->
      <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4">
        ${[3, 2, 1].map(k => `
        <button data-a="mood" data-v="${k}" class="btn w-full min-h-[140px] md:min-h-[180px] rounded-3xl border-4 flex flex-row md:flex-col justify-center items-center gap-5 px-6 hover:shadow-lg transition-shadow" style="background:${MOODS[k].soft};border-color:${MOODS[k].color}">
          <span class="text-7xl md:text-8xl">${MOODS[k].emoji}</span>
          <span class="text-3xl md:text-4xl font-bold" style="color:${MOODS[k].color}">${MOODS[k].label}</span>
        </button>`).join('')}
      </div>
    </div>`;

      if (S.step === 2) return `
    <div class="max-w-5xl mx-auto px-4 pt-5 md:pt-8"><button data-a="back" class="btn bg-white border-2 border-slate-300 px-5 py-2.5 rounded-xl font-bold hover:bg-slate-50 flex items-center gap-2 w-max">${icon('arrow-left', 'w-5 h-5')} Kembali</button></div>
    <div class="max-w-5xl mx-auto px-4 mt-6 md:mt-8 rise">
      <h1 class="text-3xl md:text-4xl font-bold">Apakah Anda memerlukan sesuatu?</h1>
      <p class="text-xl text-slate-600 mt-2">Bisa pilih lebih dari satu.</p>
      <!-- Grid 2 kolom di desktop -->
      <div class="mt-6 grid grid-cols-1 md:grid-cols-2 gap-4">
        ${NEEDS.map(n => {
        const on = S.needs.includes(n.label); return `
        <button data-a="need" data-id="${n.label}" class="btn w-full min-h-[80px] rounded-2xl border-4 text-xl font-bold flex items-center gap-4 px-5 text-left transition-colors ${on ? 'bg-brand-700 border-brand-900 text-white shadow-md' : 'bg-white border-slate-300 hover:border-brand-300'}">
          <span class="text-4xl md:text-5xl">${n.emoji}</span><span class="flex-1">${n.label}</span>
        </button>`;
      }).join('')}
      </div>
      <button data-a="finish" class="btn mt-8 w-full md:max-w-md mx-auto block min-h-[72px] rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-2xl font-bold shadow-lg">Kirim Laporan</button>
    </div>`;

      return `
    <div class="px-4 pt-20 text-center rise max-w-2xl mx-auto">
      <div class="text-8xl md:text-[120px] drop-shadow-md">${MOODS[S.mood].emoji}</div>
      <h1 class="text-4xl md:text-5xl font-bold mt-6">Terima kasih!</h1>
      <p class="text-xl md:text-2xl mt-4 text-slate-700">Laporan Anda sudah tersimpan di database.</p>
      <button data-a="nav" data-v="home" class="btn mt-10 w-full max-w-sm mx-auto flex justify-center items-center min-h-[72px] rounded-2xl bg-brand-700 hover:bg-brand-800 text-white text-xl font-bold shadow-xl">Kembali ke Beranda</button>
    </div>`;
    }

    function viewWatch() {
      const att = DB.residents.filter(r => r.filled && (r.mood === 'sad' || (r.needs && r.needs.length > 0)));
      const pending = DB.residents.filter(r => !r.filled);

      const moodUI = {
        'sad': { emoji: '😢', label: 'Sedih', color: '#b91c1c', soft: '#fee2e2' },
        'neutral': { emoji: '🙂', label: 'Biasa saja', color: '#a16207', soft: '#fef3c7' },
        'happy': { emoji: '😊', label: 'Senang', color: '#047857', soft: '#d1fae5' }
      };

      const last7Days = Array.from({ length: 7 }, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - (6 - i));
        return d.toLocaleDateString('id-ID', { weekday: 'short' }).slice(0, 3);
      });

      return `
  <header class="bg-brand-700 text-white px-5 pt-8 pb-7 md:pt-12 md:pb-10 shadow-md">
    <div class="max-w-5xl mx-auto">
      <h1 class="text-3xl md:text-4xl font-bold">Pantauan Pengasuh</h1>
    </div>
  </header>
  <div class="px-4 mt-6 md:mt-8 space-y-8 max-w-5xl mx-auto">
    <section>
      <h2 class="text-2xl md:text-3xl font-bold mb-4 flex items-center gap-2">🔔 Perlu Diperhatikan</h2>
      ${att.length ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${att.map(r => {
        const m = moodUI[r.mood] || moodUI['neutral'];
        return `
        <div class="rounded-2xl border-4 p-5 bg-white shadow-sm flex flex-col" style="border-color:${m.color}">
          <div class="flex items-center gap-4 border-b pb-4 mb-4">
            ${avatar(r.name)}
            <div class="flex-1 min-w-0">
              <p class="text-xl font-bold truncate">${r.name}</p>
              <p class="text-base text-slate-500 font-medium">Kamar ${r.room || '-'}</p>
            </div>
            <span class="text-5xl md:text-6xl">${m.emoji}</span>
          </div>
          <p class="text-xl font-bold" style="color:${m.color}">${m.label}</p>
          ${r.needs && r.needs.length ? `<ul class="mt-3 space-y-2 flex-1">${r.needs.map(n => `<li class="text-lg flex items-start gap-2"><span class="mt-1">▪</span> <span>${n}</span></li>`).join('')}</ul>` : ''}
        </div>`;
      }).join('')}</div>`
          : `<div class="bg-emerald-50 text-emerald-800 border-2 border-emerald-300 rounded-2xl p-6 text-xl font-bold shadow-sm">✅ Semua dalam keadaan baik hari ini.</div>`}
    </section>

    <section>
      <h2 class="text-2xl md:text-3xl font-bold mb-4 flex items-center gap-2">⏳ Belum Mengisi</h2>
      ${pending.length ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${pending.map(r => `
        <div class="w-full text-left bg-white rounded-2xl border-2 border-slate-300 p-4 flex items-center gap-4 shadow-sm">
          ${avatar(r.name)}
          <span class="flex-1 text-xl font-bold truncate">${r.name}</span>
          <span class="text-slate-400 font-medium text-base">Belum ada data</span>
        </div>`).join('')}</div>`
          : `<p class="text-lg text-slate-600 bg-white border-2 border-slate-200 rounded-2xl p-6 shadow-sm">Semua sudah mengisi 🎉</p>`}
    </section>

    <section class="pb-8">
      <h2 class="text-2xl md:text-3xl font-bold mb-4 flex items-center gap-2">📅 7 Hari Terakhir</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        ${DB.residents.map(r => {
            const hist = Array.isArray(r.history) && r.history.length === 7
              ? r.history
              : ['happy', 'happy', 'neutral', 'sad', 'neutral', 'happy', r.mood || null];

            return `
          <div class="bg-white border-2 border-slate-200 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow">
            <p class="text-xl font-bold mb-4 truncate">${r.name}</p>
            <div class="grid grid-cols-7 gap-1 md:gap-2 text-center">
              ${hist.map((moodStr, i) => {
              const m = moodUI[moodStr];
              return `
                <div>
                  <div class="aspect-square rounded-xl flex items-center justify-center text-xl md:text-2xl ${m ? '' : 'bg-slate-100 text-slate-300'}" 
                       ${m ? `style="background:${m.soft}"` : ''} title="${m ? m.label : 'Belum isi'}">
                    ${m ? m.emoji : '–'}
                  </div>
                  <p class="text-[11px] md:text-xs font-bold text-slate-500 mt-1">${last7Days[i]}</p>
                </div>`;
            }).join('')}
            </div>
          </div>`;
          }).join('')}
      </div>
    </section>
  </div>`;
    }

    function viewManage() {
      return `
  <header class="bg-brand-700 text-white px-5 pt-8 pb-7 md:pt-12 md:pb-10 shadow-md">
    <div class="max-w-5xl mx-auto"><h1 class="text-3xl md:text-4xl font-bold">Kelola Lansia</h1></div>
  </header>
  <div class="px-4 mt-6 md:mt-8 space-y-6 max-w-2xl mx-auto">
    <section class="bg-white border-2 border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm">
      <h2 class="text-2xl md:text-3xl font-bold mb-5 flex items-center gap-2">➕ Tambah Nama Baru</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-slate-700 font-bold mb-2">Nama Lengkap</label>
          <input id="a-name" placeholder="Contoh: Oma Ratna" class="w-full border-2 border-slate-300 focus:border-brand-500 rounded-xl p-4 text-lg outline-none transition-colors">
        </div>
        <div>
          <label class="block text-slate-700 font-bold mb-2">Kamar (Opsional)</label>
          <input id="a-room" placeholder="Contoh: Melati 03" class="w-full border-2 border-slate-300 focus:border-brand-500 rounded-xl p-4 text-lg outline-none transition-colors">
        </div>
        <button data-a="add" class="btn w-full bg-brand-700 hover:bg-brand-800 text-white py-4 mt-2 rounded-xl font-bold text-xl shadow-md">Tambah</button>
      </div>
    </section>
  </div>`;
    }

    // ==========================================
    // 5. RENDER & EVENT LISTENER
    // ==========================================
    function renderNav() {
      const nav = $('#bottom-nav');
      // Sembunyikan navigasi di halaman checkin & landing
      nav.style.display = (S.view === 'checkin' || S.view === 'landing') ? 'none' : '';

      const item = (v, ic, label) => {
        const isActive = S.view === v;
        return `
        <button data-a="nav" data-v="${v}" class="btn flex-1 md:flex-none md:px-6 md:py-3 flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 py-2 transition-all ${isActive ? 'text-brand-800 md:bg-brand-50 md:rounded-xl' : 'text-slate-500 md:hover:bg-slate-50 md:rounded-xl'}">
          ${icon(ic, 'w-6 h-6 md:w-5 md:h-5')}
          <span class="text-[13px] md:text-base font-bold">${label}</span>
        </button>`;
      };

      // Pada tampilan desktop (md:), menu akan berjejer di tengah dengan tampilan profesional
      nav.innerHTML = `<div class="flex max-w-5xl mx-auto px-2 md:px-5 justify-between md:justify-start md:gap-4 md:items-center md:h-16">${item('home', 'house', 'Beranda')}${item('watch', 'clipboard-list', 'Pantauan Pengasuh')}${item('manage', 'users', 'Kelola Lansia')}</div>`;
    }

    const VIEWS = { landing: viewLanding, home: viewHome, checkin: viewCheckin, watch: viewWatch, manage: viewManage };

    function render() {
      $('#view').innerHTML = VIEWS[S.view]();
      renderNav();
      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('click', e => {
      const el = e.target.closest('[data-a]'); if (!el) return;
      const { a, id, v } = el.dataset;
      switch (a) {
        case 'nav': S.view = v; loadData(); render(); window.scrollTo(0, 0); break;
        case 'start': S.view = 'checkin'; S.step = 1; S.rid = id; S.mood = null; S.needs = []; render(); window.scrollTo(0, 0); break;
        case 'back': S.step = 1; render(); window.scrollTo(0, 0); break;
        case 'mood': S.mood = +v; S.step = 2; render(); window.scrollTo(0, 0); break;
        case 'need': S.needs.includes(id) ? S.needs = S.needs.filter(x => x !== id) : S.needs.push(id); render(); break;
        case 'finish': finishCheckin(); break;
        case 'add': addResident(); break;
      }
    });

    loadData();
    render();
  </script>
</body>

</html>
