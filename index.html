<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#6D28D9" />
  <title>RuangTerhubung — Check-in Perasaan Lansia</title>

  <!-- Deteksi Error Anti-Blank Putih -->
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      document.body.innerHTML = `<div style="padding: 20px; font-family: sans-serif; color: #b91c1c; background: #fee2e2; min-height: 100vh;">
        <h2 style="margin-top:0;">Terjadi Kesalahan Sistem!</h2>
        <p><b>Pesan:</b> ${message}</p>
        <p><b>Baris:</b> ${lineno}</p>
        <p>Kemungkinan kode terpotong saat proses copy-paste. Silakan copy ulang seluruh kode.</p>
      </div>`;
    };
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Library Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Atkinson Hyperlegible"', 'sans-serif'] },
          colors: { brand: { 50: '#f5f3ff', 100: '#ede9fe', 700: '#6D28D9', 800: '#5b21b6' } }
        }
      }
    };
  </script>
  <style>
    /* PERBAIKAN UKURAN: Di HP lebih kecil (14px) agar rapi, di Laptop normal (16px) */
    html {
      font-size: 14px;
      -webkit-tap-highlight-color: transparent;
    }

    @media (min-width: 768px) {
      html {
        font-size: 16px;
      }
    }

    body {
      background: #f8fafc;
    }

    .btn:active {
      transform: scale(.97);
      transition: transform .12s;
    }

    .rise {
      animation: rise .35s ease both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Animasi Pop-up Modal */
    .modal-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal-slide-up {
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>

<body class="font-sans text-slate-900 antialiased md:flex md:h-screen md:overflow-hidden">

  <!-- Navigasi -->
  <nav id="bottom-nav"
    class="fixed bottom-0 left-0 w-full md:static md:w-72 md:h-full bg-white border-t border-slate-200 md:border-t-0 md:border-r shadow-[0_-4px_10px_rgba(0,0,0,0.03)] md:shadow-sm z-40 shrink-0 transition-all">
  </nav>

  <!-- Container Utama Konten -->
  <div id="app" class="w-full pb-28 md:pb-0 md:flex-1 md:h-full md:overflow-y-auto no-scrollbar relative">
    <main id="view" class="h-full"></main>
  </div>

  <!-- Tempat untuk Modal Detail -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script>
    // ==========================================
    // 1. KONEKSI KE SUPABASE
    // ==========================================
    const supabaseUrl = 'https://qbqqexduxvoykzhxflps.supabase.co';
    const supabaseKey = 'sb_publishable_uGEAHL2TBO70d6L-pCo-0A_hNjH8my9';

    if (!window.supabase) throw new Error("Library Supabase gagal dimuat. Pastikan koneksi internet aktif.");
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    // ==========================================
    // 2. STATE & DATA
    // ==========================================
    let DB = { residents: [] };
    const savedView = localStorage.getItem('rt_last_view') || 'landing';
    const S = { view: savedView, step: 1, rid: null, mood: null, needs: [] };

    const MOODS = {
      1: { emoji: '😢', label: 'Sedih', color: '#b91c1c', soft: '#fee2e2' },
      2: { emoji: '🙂', label: 'Biasa saja', color: '#a16207', soft: '#fef3c7' },
      3: { emoji: '😊', label: 'Senang', color: '#047857', soft: '#d1fae5' }
    };

    const NEEDS = [
      { id: 'ngobrol', emoji: '💬', label: 'Ditemani ngobrol' },
      { id: 'keluarga', emoji: '📞', label: 'Menghubungi keluarga' },
      { id: 'ibadah', emoji: '🙏', label: 'Beribadah' },
      { id: 'jalan', emoji: '🌿', label: 'Jalan-jalan' },
      { id: 'kegiatan', emoji: '🎨', label: 'Ikut kegiatan' },
      { id: 'sepi', emoji: '😞', label: 'Merasa kesepian' }
    ];

    const $ = s => document.querySelector(s);
    const icon = (name, cls = 'w-7 h-7') => `<i data-lucide="${name}" class="${cls}"></i>`;
    const avatar = (name) => `<div class="w-14 h-14 shrink-0 rounded-full bg-brand-700 text-white text-2xl font-bold flex items-center justify-center">${name ? name[0].toUpperCase() : '?'}</div>`;

    function toast(msg, isError = false) {
      const el = document.createElement('div');
      el.className = `fixed top-10 md:top-6 left-0 right-0 mx-auto w-max max-w-[90vw] md:left-auto md:right-6 md:mx-0 z-[100] rise ${isError ? 'bg-red-700' : 'bg-slate-900'} text-white font-bold px-6 py-4 rounded-2xl shadow-2xl text-center min-w-[280px]`;
      el.textContent = msg;
      $('#toast-root').appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    function closeDetail() {
      $('#modal-root').innerHTML = '';
    }

    function openDetail(id) {
      const r = DB.residents.find(x => x.id == id);
      if (!r) return;

      const moodUI = {
        'sad': { emoji: '😢', label: 'Sedih', color: '#b91c1c', soft: '#fee2e2' },
        'neutral': { emoji: '🙂', label: 'Biasa saja', color: '#a16207', soft: '#fef3c7' },
        'happy': { emoji: '😊', label: 'Senang', color: '#047857', soft: '#d1fae5' }
      };

      const m = moodUI[r.mood];
      const isFilled = r.filled && m;

      $('#modal-root').innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4">
          <!-- Backdrop -->
          <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm modal-fade-in" onclick="closeDetail()"></div>
          
          <!-- Modal Card -->
          <div class="relative bg-white rounded-3xl w-full max-w-md shadow-2xl modal-slide-up overflow-hidden">
            <!-- Header Modal -->
            <div class="bg-slate-50 border-b border-slate-100 p-5 flex items-center justify-between">
              <h3 class="font-bold text-xl text-slate-800">Detail Lansia</h3>
              <button onclick="closeDetail()" class="p-2 hover:bg-slate-200 rounded-full transition-colors text-slate-500">${icon('x', 'w-6 h-6')}</button>
            </div>
            
            <!-- Body Modal -->
            <div class="p-6 space-y-6">
              <div class="flex items-center gap-4">
                ${avatar(r.name)}
                <div>
                  <p class="text-2xl font-bold text-slate-800">${r.name}</p>
                  <p class="text-slate-500 font-medium">${r.room || 'Kamar Tidak Diketahui'}</p>
                </div>
              </div>

              <div class="border-t border-slate-100 pt-5">
                <p class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Status Hari Ini</p>
                
                ${isFilled ? `
                  <div class="rounded-2xl p-4 flex items-center gap-4 mb-4" style="background:${m.soft}">
                    <span class="text-4xl drop-shadow-sm">${m.emoji}</span>
                    <div>
                      <p class="font-bold text-lg" style="color:${m.color}">${m.label}</p>
                      <p class="text-sm opacity-80" style="color:${m.color}">Diperbarui pukul ${r.time}</p>
                    </div>
                  </div>
                  
                  ${r.needs && r.needs.length > 0 ? `
                    <p class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">Yang Dibutuhkan:</p>
                    <ul class="space-y-2">
                      ${r.needs.map(n => `<li class="flex items-center gap-2 text-slate-700 font-medium"><div class="w-1.5 h-1.5 rounded-full bg-brand-500"></div>${n}</li>`).join('')}
                    </ul>
                  ` : `
                    <p class="text-slate-500 italic">Tidak ada kebutuhan khusus yang diminta hari ini.</p>
                  `}
                ` : `
                  <div class="bg-slate-50 border border-slate-200 rounded-2xl p-5 text-center">
                    <span class="text-3xl mb-2 block">⏳</span>
                    <p class="text-slate-500 font-medium">Lansia ini belum mengisi form atau belum dipantau hari ini.</p>
                  </div>
                `}
              </div>
            </div>
          </div>
        </div>
      `;
      if (window.lucide) lucide.createIcons();
    }


    // ==========================================
    // 3. FUNGSI DATABASE (DIOPTIMASI ANTI-LAG)
    // ==========================================
    async function loadData() {
      try {
        const { data, error } = await supabaseClient.from('residents').select('*').order('id', { ascending: true });

        if (error) {
          toast("Database Terkunci! Matikan fitur RLS di menu SQL Supabase Anda.", true);
          throw error;
        }

        if (data) {
          const isChanged = JSON.stringify(DB.residents) !== JSON.stringify(data);
          DB.residents = data;

          if (isChanged && S.view !== 'landing') {
            render();
          }
        }
      } catch (err) {
        console.error("Gagal memuat data:", err);
      }
    }

    async function finishCheckin() {
      const now = new Date();
      const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
      const moodName = S.mood === 1 ? 'sad' : S.mood === 2 ? 'neutral' : 'happy';

      const r = DB.residents.find(x => x.id == S.rid);

      // LOGIKA BERGULIR 7 HARI (Rolling First-In First-Out) dengan default kosong
      let updatedHistory = Array.isArray(r.history) && r.history.length === 7
        ? [...r.history]
        : [null, null, null, null, null, null, null];

      if (!r.filled) {
        // Jika form baru diisi hari ini: Geser semua data ke kiri
        updatedHistory.shift();
        updatedHistory.push(moodName);
      } else {
        // Jika sekadar ganti pilihan di hari yang sama: Timpa data paling ujung kanan
        updatedHistory[6] = moodName;
      }

      await supabaseClient.from('residents').update({
        filled: true,
        time: timeStr,
        mood: moodName,
        needs: S.needs,
        history: updatedHistory
      }).eq('id', S.rid);

      S.step = 3;
      render();
      window.scrollTo(0, 0); $('#app').scrollTo(0, 0);
      loadData();
    }

    async function addResident() {
      const name = $('#a-name').value.trim();
      const room = $('#a-room').value.trim();
      if (!name) return toast('Mohon isi nama dulu');

      // PERBAIKAN: Lansia baru dibuat dengan riwayat 7 hari murni kosong
      const defaultHistory = [null, null, null, null, null, null, null];

      const { error } = await supabaseClient.from('residents').insert([{
        name,
        room,
        filled: false,
        needs: [],
        history: defaultHistory
      }]);

      if (error) return toast("Gagal menyimpan. Pastikan RLS Supabase sudah dimatikan.", true);

      toast(`${name} ditambahkan!`);

      $('#a-name').value = '';
      $('#a-room').value = '';
      loadData();
    }

    // ==========================================
    // 4. TAMPILAN HALAMAN (UI)
    // ==========================================

    function viewLanding() {
      return `
  <div class="fixed inset-0 bg-brand-700 flex flex-col items-center justify-center text-white px-6 text-center z-50">
    <div class="w-24 h-24 bg-white/10 rounded-full flex items-center justify-center mb-6 rise">${icon('heart-handshake', 'w-12 h-12 text-white')}</div>
    <h1 class="text-4xl md:text-6xl font-bold mb-3 rise">RuangTerhubung</h1>
    <p class="text-xl md:text-2xl text-brand-100 mb-10 max-w-lg mx-auto rise">Sistem pantauan emosional harian lansia.</p>
    <button data-a="nav" data-v="home" class="btn w-full max-w-md min-h-[68px] rounded-2xl text-xl font-bold bg-white text-brand-800 shadow-xl rise hover:scale-105 transition-transform">Masuk ke Aplikasi</button>
  </div>`;
    }

    function viewHome() {
      const done = DB.residents.filter(r => r.filled).length;
      return `
  <div class="p-5 md:p-10 max-w-6xl mx-auto space-y-8 rise">
    <header>
      <h1 class="text-3xl md:text-4xl font-bold text-slate-800">Selamat datang! 👋</h1>
      <p class="text-lg text-slate-500 mt-2">Pilih nama Anda untuk mulai check-in hari ini.</p>
    </header>

    <div class="bg-white rounded-2xl border border-slate-200 p-5 flex items-center gap-4 shadow-sm">
      <span class="text-4xl">📋</span>
      <div>
        <p class="text-xl font-bold text-slate-800">${done} dari ${DB.residents.length}</p>
        <p class="text-base text-slate-500">Orang sudah mengisi hari ini</p>
      </div>
    </div>

    <section>
      <div class="mb-5">
        <h2 class="text-xl font-bold text-slate-800">Daftar Lansia</h2>
        <p class="text-sm text-brand-700 font-medium mt-1 bg-brand-50 inline-block px-3 py-1 rounded-lg">👉 Klik nama lansia di bawah ini untuk mengisi / memantau</p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        ${DB.residents.map(r => `
        <button data-a="start" data-id="${r.id}" class="btn w-full text-left bg-white rounded-2xl border-2 ${r.filled ? 'border-emerald-400 shadow-emerald-50' : 'border-slate-200 hover:border-brand-400'} p-4 flex items-center gap-4 hover:shadow-md transition-all">
          ${avatar(r.name)}
          <span class="flex-1 min-w-0">
            <span class="block text-xl font-bold truncate">${r.name}</span>
            <span class="block text-base ${r.filled ? 'text-emerald-700 font-medium' : 'text-slate-400'}">${r.filled ? 'Sudah mengisi (' + (r.time || '') + ')' : 'Belum mengisi'}</span>
          </span>
          ${icon('chevron-right', 'w-7 h-7 text-slate-300')}
        </button>`).join('')}
      </div>
    </section>
  </div>`;
    }

    function viewCheckin() {
      const r = DB.residents.find(x => x.id == S.rid);
      if (!r) return viewHome();

      if (S.step === 1) return `
    <div class="max-w-5xl mx-auto px-5 pt-8"><button data-a="nav" data-v="home" class="btn bg-white border border-slate-300 px-5 py-2.5 rounded-xl font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-2 w-max shadow-sm">${icon('arrow-left', 'w-5 h-5')} Kembali</button></div>
    <div class="max-w-5xl mx-auto px-5 mt-8 md:mt-12 rise">
      <h1 class="text-3xl md:text-5xl font-bold leading-tight text-slate-800">Halo, ${r.name.split(' ')[0]}.<br/><span class="text-brand-700">Bagaimana perasaan Anda hari ini?</span></h1>
      <div class="mt-10 grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
        ${[3, 2, 1].map(k => `
        <button data-a="mood" data-v="${k}" class="btn w-full min-h-[140px] md:min-h-[220px] rounded-3xl border-4 flex flex-row md:flex-col justify-center items-center gap-5 px-6 hover:shadow-xl transition-all" style="background:${MOODS[k].soft};border-color:${MOODS[k].color}">
          <span class="text-7xl md:text-[100px]">${MOODS[k].emoji}</span>
          <span class="text-3xl md:text-4xl font-bold" style="color:${MOODS[k].color}">${MOODS[k].label}</span>
        </button>`).join('')}
      </div>
    </div>`;

      if (S.step === 2) return `
    <div class="max-w-5xl mx-auto px-5 pt-8"><button data-a="back" class="btn bg-white border border-slate-300 px-5 py-2.5 rounded-xl font-bold text-slate-700 hover:bg-slate-50 flex items-center gap-2 w-max shadow-sm">${icon('arrow-left', 'w-5 h-5')} Kembali</button></div>
    <div class="max-w-5xl mx-auto px-5 mt-8 md:mt-12 rise">
      <h1 class="text-3xl md:text-4xl font-bold text-slate-800">Apakah Anda memerlukan sesuatu?</h1>
      <p class="text-xl text-slate-500 mt-2">Bisa pilih lebih dari satu pilihan di bawah.</p>
      <div class="mt-8 grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
        ${NEEDS.map(n => {
        const on = S.needs.includes(n.label); return `
        <button data-a="need" data-id="${n.label}" class="btn w-full min-h-[80px] rounded-2xl border-4 text-xl font-bold flex items-center gap-4 px-6 text-left transition-colors ${on ? 'bg-brand-700 border-brand-900 text-white shadow-md' : 'bg-white border-slate-300 hover:border-brand-200 shadow-sm'}">
          <span class="text-4xl md:text-5xl">${n.emoji}</span><span class="flex-1">${n.label}</span>
        </button>`;
      }).join('')}
      </div>
      <button data-a="finish" class="btn mt-10 w-full md:max-w-md mx-auto block min-h-[72px] rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-2xl font-bold shadow-lg">Kirim Laporan</button>
    </div>`;

      return `
    <div class="px-5 pt-24 text-center rise max-w-2xl mx-auto">
      <div class="text-8xl md:text-[140px] drop-shadow-md">${MOODS[S.mood].emoji}</div>
      <h1 class="text-4xl md:text-5xl font-bold mt-8 text-slate-800">Terima kasih!</h1>
      <p class="text-xl md:text-2xl mt-4 text-slate-600">Laporan Anda sudah tersimpan di sistem.</p>
      <button data-a="nav" data-v="home" class="btn mt-12 w-full max-w-sm mx-auto flex justify-center items-center min-h-[72px] rounded-2xl bg-brand-700 hover:bg-brand-800 text-white text-xl font-bold shadow-xl">Kembali ke Beranda</button>
    </div>`;
    }

    function viewWatch() {
      const att = DB.residents.filter(r => r.filled && (r.mood === 'sad' || (r.needs && r.needs.length > 0)));
      const pending = DB.residents.filter(r => !r.filled);

      const moodUI = {
        'sad': { emoji: '😢', label: 'Sedih', color: '#b91c1c', soft: '#fee2e2' },
        'neutral': { emoji: '🙂', label: 'Biasa saja', color: '#a16207', soft: '#fef3c7' },
        'happy': { emoji: '😊', label: 'Senang', color: '#047857', soft: '#d1fae5' }
      };

      const last7Days = Array.from({ length: 7 }, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - (6 - i));
        return d.toLocaleDateString('id-ID', { weekday: 'short' }).slice(0, 3);
      });

      return `
  <div class="p-5 md:p-10 max-w-6xl mx-auto space-y-10 rise">
    <header>
      <h1 class="text-3xl md:text-4xl font-bold text-slate-800">Pantauan Pengasuh</h1>
      <p class="text-lg text-slate-500 mt-2">Ringkasan kondisi dan kebutuhan lansia hari ini.</p>
    </header>

    <section>
      <h2 class="text-xl md:text-2xl font-bold text-slate-800 mb-5 flex items-center gap-2">🔔 Perlu Diperhatikan</h2>
      ${att.length ? `<div class="grid grid-cols-1 md:grid-cols-2 gap-5">${att.map(r => {
        const m = moodUI[r.mood] || moodUI['neutral'];
        return `
        <div class="rounded-3xl border-4 p-6 bg-white shadow-sm flex flex-col" style="border-color:${m.color}">
          <div class="flex items-center gap-4 border-b border-slate-100 pb-5 mb-5">
            ${avatar(r.name)}
            <div class="flex-1 min-w-0">
              <p class="text-xl font-bold truncate text-slate-800">${r.name}</p>
              <p class="text-base text-slate-500">Kamar ${r.room || '-'}</p>
            </div>
            <span class="text-5xl md:text-6xl drop-shadow-sm">${m.emoji}</span>
          </div>
          <p class="text-xl font-bold" style="color:${m.color}">${m.label}</p>
          ${r.needs && r.needs.length ? `<ul class="mt-4 space-y-3 flex-1">${r.needs.map(n => `<li class="text-lg text-slate-700 flex items-start gap-2"><span class="mt-1 text-slate-400">▪</span> <span>${n}</span></li>`).join('')}</ul>` : ''}
        </div>`;
      }).join('')}</div>`
          : `<div class="bg-emerald-50 text-emerald-800 border-2 border-emerald-200 rounded-2xl p-6 text-xl font-bold shadow-sm">✅ Semua lansia dalam keadaan baik hari ini.</div>`}
    </section>

    <section>
      <h2 class="text-xl md:text-2xl font-bold text-slate-800 mb-5 flex items-center gap-2">⏳ Belum Mengisi</h2>
      ${pending.length ? `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${pending.map(r => `
        <div class="w-full bg-white rounded-2xl border border-slate-200 p-4 flex items-center gap-4 shadow-sm">
          ${avatar(r.name)}
          <span class="flex-1 text-xl font-bold text-slate-700 truncate">${r.name}</span>
          <span class="text-slate-400 font-medium text-sm border border-slate-200 px-3 py-1 rounded-full">Belum</span>
        </div>`).join('')}</div>`
          : `<p class="text-lg text-slate-500 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">Semua lansia sudah mengisi form 🎉</p>`}
    </section>

    <section class="pb-8">
      <div class="mb-5">
        <h2 class="text-xl md:text-2xl font-bold text-slate-800 flex items-center gap-2">📅 Riwayat 7 Hari Terakhir</h2>
        <p class="text-sm text-slate-500 mt-1">Klik kotak nama lansia untuk melihat detail hari ini.</p>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        ${DB.residents.map(r => {
            const hist = Array.isArray(r.history) && r.history.length === 7
              ? r.history
              : [null, null, null, null, null, null, null];

            return `
          <button onclick="openDetail(${r.id})" class="text-left w-full bg-white border border-slate-200 rounded-3xl p-6 shadow-sm hover:shadow-md hover:border-brand-300 transition-all focus:outline-none">
            <div class="flex justify-between items-center mb-5">
              <p class="text-xl font-bold text-slate-800 truncate pr-2">${r.name}</p>
              ${icon('zoom-in', 'w-5 h-5 text-slate-300')}
            </div>
            <div class="grid grid-cols-7 gap-1 md:gap-2 text-center">
              ${hist.map((moodStr, i) => {
              const m = moodUI[moodStr];
              return `
                <div class="flex flex-col items-center">
                  <div class="w-full aspect-square rounded-xl flex items-center justify-center text-xl md:text-2xl ${m ? '' : 'bg-slate-50 text-slate-300 border border-slate-100'}" 
                       ${m ? `style="background:${m.soft}"` : ''} title="${m ? m.label : 'Belum isi'}">
                    ${m ? m.emoji : '–'}
                  </div>
                  <p class="text-[11px] md:text-xs font-bold text-slate-400 mt-2">${last7Days[i]}</p>
                </div>`;
            }).join('')}
            </div>
          </button>`;
          }).join('')}
      </div>
    </section>
  </div>`;
    }

    function viewManage() {
      return `
  <div class="p-5 md:p-10 max-w-3xl mx-auto space-y-8 rise">
    <header>
      <h1 class="text-3xl md:text-4xl font-bold text-slate-800">Kelola Lansia</h1>
      <p class="text-lg text-slate-500 mt-2">Tambahkan data lansia ke dalam sistem.</p>
    </header>

    <section class="bg-white border border-slate-200 rounded-3xl p-6 md:p-8 shadow-sm">
      <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">➕ Tambah Nama Baru</h2>
      <div class="space-y-5">
        <div>
          <label class="block text-slate-600 font-bold mb-2">Nama Lengkap</label>
          <input id="a-name" placeholder="Contoh: Oma Ratna" class="w-full border-2 border-slate-200 focus:border-brand-500 rounded-xl p-4 text-lg outline-none transition-colors bg-slate-50 focus:bg-white">
        </div>
        <div>
          <label class="block text-slate-600 font-bold mb-2">Kamar (Opsional)</label>
          <input id="a-room" placeholder="Contoh: Melati 03" class="w-full border-2 border-slate-200 focus:border-brand-500 rounded-xl p-4 text-lg outline-none transition-colors bg-slate-50 focus:bg-white">
        </div>
        <button data-a="add" class="btn w-full bg-brand-700 hover:bg-brand-800 text-white py-4 mt-4 rounded-xl font-bold text-xl shadow-md">Simpan</button>
      </div>
    </section>
  </div>`;
    }

    // ==========================================
    // 5. RENDER & EVENT LISTENER (SIDEBAR LOGIC)
    // ==========================================
    function renderNav() {
      const nav = $('#bottom-nav');

      if (S.view === 'checkin' || S.view === 'landing') {
        nav.style.display = 'none';
        return;
      }

      nav.style.display = 'block';
      const isActive = (v) => S.view === v;

      const item = (v, ic, label) => `
        <button data-a="nav" data-v="${v}" class="btn flex-1 md:flex-none flex flex-col md:flex-row items-center md:justify-start gap-1 md:gap-4 py-3 md:py-4 md:px-6 md:rounded-2xl transition-all ${isActive(v) ? 'text-brand-700 md:bg-brand-50 md:shadow-sm' : 'text-slate-400 hover:text-slate-800 md:hover:bg-slate-50'}">
          ${icon(ic, 'w-6 h-6')}
          <span class="text-[12px] md:text-lg font-bold">${label}</span>
        </button>`;

      const brandHeader = `
        <div class="hidden md:flex flex-col items-center justify-center gap-3 px-6 pb-6 pt-10 border-b border-slate-100 text-brand-700 w-full mb-4">
          <div class="bg-brand-100 p-3 rounded-2xl">${icon('heart-handshake', 'w-10 h-10')}</div>
          <span class="text-2xl font-bold text-center">Ruang<br>Terhubung</span>
        </div>`;

      nav.innerHTML = `
        ${brandHeader}
        <div class="flex flex-row md:flex-col w-full gap-1 md:gap-2 px-2 md:px-4">
          ${item('home', 'house', 'Beranda')}
          ${item('watch', 'clipboard-list', 'Pantauan')}
          ${item('manage', 'users', 'Kelola')}
        </div>`;
    }

    const VIEWS = { landing: viewLanding, home: viewHome, checkin: viewCheckin, watch: viewWatch, manage: viewManage };

    function render() {
      $('#view').innerHTML = VIEWS[S.view]();
      renderNav();
      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('click', e => {
      const el = e.target.closest('[data-a]'); if (!el) return;
      const { a, id, v } = el.dataset;
      switch (a) {
        case 'nav':
          S.view = v;
          localStorage.setItem('rt_last_view', v);
          render();
          window.scrollTo(0, 0); $('#app').scrollTo(0, 0);
          loadData();
          break;
        case 'start':
          S.view = 'checkin';
          localStorage.setItem('rt_last_view', 'checkin');
          S.step = 1; S.rid = id; S.mood = null; S.needs = [];
          render();
          window.scrollTo(0, 0); $('#app').scrollTo(0, 0);
          break;
        case 'back':
          S.step = 1;
          render();
          window.scrollTo(0, 0); $('#app').scrollTo(0, 0);
          break;
        case 'mood':
          S.mood = +v; S.step = 2;
          render();
          window.scrollTo(0, 0); $('#app').scrollTo(0, 0);
          break;
        case 'need':
          S.needs.includes(id) ? S.needs = S.needs.filter(x => x !== id) : S.needs.push(id);
          render();
          break;
        case 'finish':
          finishCheckin();
          break;
        case 'add':
          addResident();
          break;
      }
    });

    loadData();
    render();
  </script>
</body>

</html>
